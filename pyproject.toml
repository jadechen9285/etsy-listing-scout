[project]
name = "etsy-listing-scout"
version = "0.1.0"
description = "Capture the top N Etsy search listings for a keyword into Excel/CSV"
readme = "README.md"
authors = [
    { name = "Jianhong Chen", email = "jjianhongchen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "typer>=0.27.3",
]

[project.scripts]
etsy-scout = "etsy_scout.cli:app"
etsy-trends = "etsy_scout.trends.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "etsy_scout"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
